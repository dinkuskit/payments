name: PR package preview (pkg.pr.new)

on:
  pull_request:

permissions:
  contents: read

jobs:
  preview:
    name: Publish PR preview package
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build distribution artifacts
        run: |
          npm run build
          npm run plugin:build

      - name: Publish preview via pkg.pr.new (pass with notice if GitHub App is not installed)
        run: |
          set +e
          PREVIEW_OUTPUT="$(npx pkg-pr-new publish 2>&1)"
          PREVIEW_EXIT_CODE=$?
          set -e
          printf '%s\n' "${PREVIEW_OUTPUT}"
          if [ "${PREVIEW_EXIT_CODE}" -ne 0 ]; then
            if printf '%s' "${PREVIEW_OUTPUT}" | grep -Fq "is not installed on or does not have access"; then
              echo "::notice::The pkg-pr-new GitHub App is not installed on or does not have access to this repository; install https://github.com/apps/pkg-pr-new to enable PR preview packages."
              exit 0
            fi
            exit "${PREVIEW_EXIT_CODE}"
          fi
