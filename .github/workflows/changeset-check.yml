name: Changeset Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  changeset:
    name: Require changeset on pull requests
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.ref != 'changeset-release/main' &&
      !startsWith(github.event.pull_request.title, 'ci: release')
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify changeset is present
        env:
          CHANGESET_BASE_REF: origin/${{ github.base_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: node .github/scripts/check-changeset.mjs
