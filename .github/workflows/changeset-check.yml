name: Changeset Check

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  changeset:
    name: Require changeset on pull requests
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.ref != 'changeset-release/main' &&
      !startsWith(github.event.pull_request.title, 'ci: release')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify changeset is present
        env:
          CHANGESET_BASE_REF: origin/${{ github.base_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_USER: ${{ github.event.pull_request.user.login }}
        run: node .github/scripts/check-changeset.mjs
