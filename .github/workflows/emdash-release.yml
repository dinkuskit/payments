name: Publish to EmDash Registry

# Only release.yml's version-tag run (the tag's push, or Retry the publish pressed on the tag) calls
# this: a vX.Y.Z-beta.N tag with release_mode 'beta', a vX.Y.Z tag with release_mode 'stable'. Both
# tags sit on a release/X.Y.Z branch, so the Registry record names the tested commit. It has no
# button of its own, so the release service sees release.yml as the workflow behind both Registry
# listings.
on:
  workflow_call:
    inputs:
      version:
        description: "The pushed tag's version: X.Y.Z (stable) or X.Y.Z-beta.N (beta)"
        required: true
        type: string
      release_mode:
        description: "Delegated release mode from release.yml ('beta' or 'stable')"
        required: true
        type: string
    outputs:
      slug:
        description: "The Registry listing published (dinkus-payments-beta or dinkus-payments)"
        value: ${{ jobs.publish.outputs.slug }}
      version:
        description: "The version published"
        value: ${{ jobs.publish.outputs.version }}

permissions: {}

concurrency:
  group: emdash-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Bundle and publish plugin to EmDash Registry
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.version != '' && github.ref == format('refs/tags/v{0}', inputs.version) && ((inputs.release_mode == 'beta' && contains(inputs.version, '-beta.')) || (inputs.release_mode == 'stable' && !contains(inputs.version, '-beta.')))
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required only for no-clobber release artifact uploads.
      id-token: write # Required for the audience-bound GitHub OIDC token.
      attestations: write # Required to sign build provenance.
    outputs:
      slug: ${{ steps.meta.outputs.slug }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Check repository visibility
        if: ${{ github.event.repository.visibility != 'public' }}
        run: |
          echo "::error title=Public repository required::EmDash releases currently require a public GitHub repository because private and internal repository attestations cannot yet be verified."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Enforce dispatch and caller gate before credential use or Registry I/O
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_MODE: ${{ inputs.release_mode }}
        run: node .github/scripts/emdash-dispatch-gate.mjs --github-output "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Resolve release version
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_MODE: ${{ inputs.release_mode }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          node scripts/release-flow.mjs validate-emdash-dispatch \
            --event-name "$EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --version "$INPUT_VERSION" \
            --release-mode "$INPUT_RELEASE_MODE"
          SLUG="dinkus-payments"
          case "$INPUT_VERSION" in *-beta.*) SLUG="dinkus-payments-beta" ;; esac
          echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"

      - name: Check whether release version is already indexed in EmDash Registry
        id: registry-check
        env:
          EMDASH_PLUGIN_SLUG: ${{ steps.meta.outputs.slug }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-flow.mjs check-registry-version \
            --slug "$EMDASH_PLUGIN_SLUG" \
            --version "$RELEASE_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare EmDash Registry release bundle
        id: prepare
        env:
          EMDASH_PLUGIN_SLUG: ${{ steps.meta.outputs.slug }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node .github/scripts/prepare-emdash-release.mjs \
            --slug "$EMDASH_PLUGIN_SLUG" \
            --version "$RELEASE_VERSION" \
            --out-dir .emdash-release \
            --github-output "$GITHUB_OUTPUT"

      - name: Upload bundled EmDash release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: emdash-plugin-${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}
          path: |
            ${{ steps.prepare.outputs.bundle-file }}
            .emdash-release/emdash-plugin.jsonc
          if-no-files-found: error

      - name: Create build provenance
        id: attest
        if: steps.registry-check.outputs.already_published != 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ steps.prepare.outputs.bundle-file }}

      - name: Prepare delegated release with listing media
        id: media
        if: steps.registry-check.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_FILE: ${{ steps.prepare.outputs.bundle-file }}
          PROVENANCE_FILE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          node scripts/registry-release-media.mjs \
            --bundle-file "$BUNDLE_FILE" \
            --provenance-file "$PROVENANCE_FILE"

      # The release service currently ends successful publishes in
      # RELEASE_CONFLICT (emdash-cms/emdash#4159), so this step's
      # outcome is not the gate. The verify step below is: the job
      # only passes when the publisher PDS record for this version
      # carries exactly the bundle bytes prepared above.
      - name: Publish plugin to EmDash Registry
        id: publish
        if: steps.registry-check.outputs.already_published != 'true'
        continue-on-error: true
        uses: emdash-cms/emdash/apps/release-action@06f911b54f387a1284c767187042d7e11f6044fc # emdash main at generation time; bump deliberately
        with:
          service-url: https://releases.emdashcms.com
          publisher-did: ${{ steps.prepare.outputs.publisher-did }}
          release-file: ${{ steps.media.outputs.release-file }}

      - name: Verify release is indexed in EmDash Registry
        id: verify
        env:
          PUBLISHER_DID: ${{ steps.prepare.outputs.publisher-did }}
          EMDASH_RELEASE_SELECTOR: ${{ steps.prepare.outputs.selector }}
          BUNDLE_FILE: ${{ steps.prepare.outputs.bundle-file }}
        run: |
          set -euo pipefail
          node .github/scripts/verify-registry-release.mjs \
            "$PUBLISHER_DID" "$EMDASH_RELEASE_SELECTOR" "$BUNDLE_FILE" \
            --media-manifest .emdash-release/emdash-plugin.jsonc

      - name: Note intent outcome
        if: ${{ always() && steps.publish.outcome == 'failure' && steps.verify.outcome == 'success' }}
        run: |
          echo "::warning title=Release intent reported failure::The delegated release intent failed (see Publish plugin to EmDash Registry step) but the Registry record was verified against the prepared bundle. Known upstream issue: emdash-cms/emdash#4159."
          {
            echo "## Registry publish verified despite intent failure"
            echo
            echo "The release intent reported failure, but the publisher PDS record for this version carries exactly the prepared bundle bytes. See emdash-cms/emdash#4159."
          } >> "$GITHUB_STEP_SUMMARY"
