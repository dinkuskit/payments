name: Publish to EmDash Registry

on:
  workflow_call:
    inputs:
      version:
        description: "Release version (e.g. 0.2.9)"
        required: true
        type: string
      release_mode:
        description: "Delegated release mode from release.yml ('stable')"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Optional beta version override (leave blank to cut next x.y.z-beta.N from pending changesets on main; stable versions are forbidden)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: emdash-registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Bundle and publish plugin to EmDash Registry
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && inputs.release_mode == 'stable' && inputs.version != ''))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Enforce dispatch and caller gate before credential use or Registry I/O
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_MODE: ${{ inputs.release_mode }}
        run: node .github/scripts/emdash-dispatch-gate.mjs --github-output "$GITHUB_OUTPUT"

      - name: Mint release GitHub App token
        id: app-token
        if: github.event_name == 'workflow_dispatch'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Configure git push authentication for beta tag
        if: github.event_name == 'workflow_dispatch'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config --local "http.https://github.com/.extraheader" "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$APP_TOKEN" | base64 | tr -d '\n')"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run unit tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Build plugin
        run: npm run build

      - name: Resolve release version (and cut beta tag when dispatched for beta)
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_RELEASE_MODE: ${{ inputs.release_mode }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          EMDASH_REGISTRY_URL: ${{ vars.EMDASH_REGISTRY_URL || 'https://emdash-registry.pages.dev' }}
        run: |
          set -euo pipefail
          node scripts/release-flow.mjs validate-emdash-dispatch \
            --event-name "$EVENT_NAME" \
            --ref "$GITHUB_REF" \
            --version "$INPUT_VERSION" \
            --release-mode "$INPUT_RELEASE_MODE"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_VERSION" ]; then
              node scripts/release-flow.mjs cut-beta --github-output "$GITHUB_OUTPUT"
            else
              node scripts/release-flow.mjs cut-beta --version "$INPUT_VERSION" --github-output "$GITHUB_OUTPUT"
            fi
          else
            VERSION="$INPUT_VERSION"
            SLUG="dinkus-payments"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          fi

      - name: Check whether release version is already indexed in EmDash Registry
        id: registry-check
        env:
          EMDASH_REGISTRY_URL: ${{ vars.EMDASH_REGISTRY_URL || 'https://emdash-registry.pages.dev' }}
          EMDASH_PLUGIN_SLUG: ${{ steps.meta.outputs.slug }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-flow.mjs check-registry-version \
            --slug "$EMDASH_PLUGIN_SLUG" \
            --version "$RELEASE_VERSION" \
            --github-output "$GITHUB_OUTPUT"

      - name: Prepare EmDash Registry release directory
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: node .github/scripts/prepare-emdash-release.mjs --version "$RELEASE_VERSION" --out-dir dist/emdash-release

      - name: Validate staged plugin manifest
        working-directory: dist/emdash-release
        run: npx --no-install emdash-plugin validate

      - name: Bundle staged plugin archive
        working-directory: dist/emdash-release
        run: npx --no-install emdash-plugin bundle --out-dir dist

      - name: Upload bundled EmDash release artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: emdash-plugin-${{ steps.meta.outputs.slug }}-${{ steps.meta.outputs.version }}
          path: |
            dist/emdash-release/dist/bundle.tar.gz
            dist/emdash-release/dist/bundle.manifest.json
            dist/emdash-release/emdash-plugin.jsonc
          if-no-files-found: error

      - name: Publish plugin to EmDash Registry
        if: steps.registry-check.outputs.already_published != 'true'
        working-directory: dist/emdash-release
        env:
          EMDASH_PDS_HANDLE: ${{ secrets.EMDASH_PDS_HANDLE }}
          EMDASH_PDS_PASSWORD: ${{ secrets.EMDASH_PDS_PASSWORD }}
          EMDASH_PDS_SERVICE: ${{ secrets.EMDASH_PDS_SERVICE }}
          EMDASH_REGISTRY_URL: ${{ vars.EMDASH_REGISTRY_URL || 'https://emdash-registry.pages.dev' }}
        run: |
          if [ -z "$EMDASH_PDS_HANDLE" ] || [ -z "$EMDASH_PDS_PASSWORD" ]; then
            echo "::error::Missing EMDASH_PDS_HANDLE or EMDASH_PDS_PASSWORD secret required for EmDash Registry publish."
            exit 1
          fi
          SERVICE_ARGS=()
          if [ -n "$EMDASH_PDS_SERVICE" ]; then
            SERVICE_ARGS=(--service "$EMDASH_PDS_SERVICE")
          fi
          npx --no-install emdash-plugin publish \
            --handle "$EMDASH_PDS_HANDLE" \
            --password "$EMDASH_PDS_PASSWORD" \
            --registry-url "$EMDASH_REGISTRY_URL" \
            "${SERVICE_ARGS[@]}"

      - name: Verify release is indexed in EmDash Registry
        env:
          EMDASH_REGISTRY_URL: ${{ vars.EMDASH_REGISTRY_URL || 'https://emdash-registry.pages.dev' }}
          EMDASH_PLUGIN_SLUG: ${{ steps.meta.outputs.slug }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: node .github/scripts/verify-registry-release.mjs --slug "$EMDASH_PLUGIN_SLUG" --version "$RELEASE_VERSION"
